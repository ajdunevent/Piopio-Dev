<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Piopio app icon: a North Island piopio (Turnagra tanagra) as a chat
       bubble. Its body is a slight squircle whose bottom-left corner is the
       bubble's tail; grey head, brown body, rufous tail, tan belly, facing
       right with its bill pointing down. -->
  <defs>
    <path id="shape" d="M14 58 C14 26 32 8 64 8 C96 8 114 26 114 58 C114 90 96 108 64 108 L14 108 Z"/>
    <clipPath id="clip"><use href="#shape"/></clipPath>
    <!-- head (grey), body (brown), tail (rufous) -->
    <linearGradient id="length" gradientUnits="userSpaceOnUse" x1="84" y1="10" x2="14" y2="108">
      <stop offset="0" stop-color="#4e5052"/>
      <stop offset="0.2" stop-color="#4e5052"/>
      <stop offset="0.36" stop-color="#6f5d3f"/>
      <stop offset="0.72" stop-color="#6f5d3f"/>
      <stop offset="0.88" stop-color="#c34a1c"/>
      <stop offset="1" stop-color="#c34a1c"/>
    </linearGradient>
  </defs>
  <!-- centred on the canvas -->
  <g transform="translate(0 6)">
    <!-- the far leg, from mid-belly, behind the body -->
    <path d="M101 88 H112.5 M112.5 84.5 V91.5" stroke="#c19a1c" stroke-width="4" stroke-linecap="round" fill="none"/>
    <g clip-path="url(#clip)">
      <rect width="128" height="128" fill="url(#length)"/>
    </g>
    <!-- light tan belly: from under the bill round to about half past five -->
    <path clip-path="url(#clip)" d="M117 45 L128 40 V128 H74 L76.5 110 C80 88 88 68 117 45 Z" fill="#dcc79c"/>
    <!-- the near leg, a sixth of the way up, in front of the body -->
    <path d="M91 99.5 H101.5 M101.5 96 V103" stroke="#c19a1c" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- wing -->
    <path d="M30 62 Q56 56 70 82 Q58 100 34 92 Q22 78 30 62 Z" fill="#4a3520"/>
    <!-- yellow eye -->
    <circle cx="88" cy="40" r="9" fill="#f8e45c"/>
    <circle cx="89.5" cy="40" r="4.5" fill="#241f31"/>
    <!-- bill, pointing down, seen at an angle: a V whose right side is
         taller and steeper, the two tops joined by a gentle curve -->
    <path d="M104.5 50.5 Q108.5 45.5 112.8 47 L111.2 59.5 Z" fill="#2c2d2e" stroke="#2c2d2e" stroke-width="1" stroke-linejoin="round"/>
  </g>
</svg>
