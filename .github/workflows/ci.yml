name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The daemon and the shared crate need no GTK, so they build and test on the
  # plain runner. The D-Bus tests start the real daemon on private session
  # buses; the end-to-end tests run against a throwaway local Prosody.
  daemon:
    name: Daemon (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # GStreamer's WebRTC stack lets the call test run real media.
      - run: |
          sudo apt-get update
          sudo apt-get install -y dbus prosody libgstreamer1.0-dev \
            libgstreamer-plugins-bad1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-bad gstreamer1.0-nice gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-base
      - run: cargo fmt --all --check
      - run: cargo clippy --locked -p piopio-daemon -p piopio-dbus --all-targets -- -D warnings
      - run: tests/server/run.sh cargo test --locked -p piopio-daemon -p piopio-dbus
        env:
          PIOPIO_SHOW_SERVER_LOG: "1"

  # The OMEMO crate, and a cross-check against python-oldmemo (the reference
  # Gajim's and Slixmpp's OMEMO is built on) in both directions.
  omemo:
    name: OMEMO (tests, interop with python-oldmemo and python-twomemo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked -p piopio-omemo --all-targets -- -D warnings
      - run: cargo test --locked -p piopio-omemo
      - run: cargo build --locked -p piopio-omemo --example oracle_cli
      - run: |
          python3 -m venv /tmp/oracle
          /tmp/oracle/bin/pip install --quiet "oldmemo[xml]" "twomemo[xml]" omemo
          /tmp/oracle/bin/python crates/piopio-omemo/tests/oracle/check.py target/debug/examples/oracle_cli
          /tmp/oracle/bin/python crates/piopio-omemo/tests/oracle/check_v2.py target/debug/examples/oracle_cli

  # The UI targets GTK 4.24 and libadwaita 1.10, which only the GNOME 51
  # runtime has, so it is checked by building the real Flatpak. Lints for the
  # UI run here against the runner's older GTK with the fallback feature set.
  ui-lint:
    name: UI (clippy, tests, older GTK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y libadwaita-1-dev libgtk-4-dev libgstreamer1.0-dev \
            libgstreamer-plugins-bad1.0-dev libgstreamer-plugins-base1.0-dev
      - run: cargo clippy --locked -p piopio --no-default-features --all-targets -- -D warnings
      - run: cargo test --locked -p piopio --no-default-features

  # Call media: two WebRTC peers in one process, over loopback.
  calls:
    name: Calls (GStreamer WebRTC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-bad1.0-dev \
            libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-bad gstreamer1.0-nice \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-base
      - run: cargo clippy --locked -p piopio-call --all-targets -- -D warnings
      - run: cargo test --locked -p piopio-call

  flatpak:
    name: Flatpak (GNOME 51)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      # The runner's disk is nearly full of preinstalled SDKs we don't use;
      # mount them so the first step can delete them.
      options: >-
        --privileged
        -v /usr/local/lib/android:/host/android
        -v /usr/share/dotnet:/host/dotnet
        -v /opt/hostedtoolcache:/host/toolcache
    steps:
      - name: Free disk space
        run: |
          rm -rf /host/android/* /host/dotnet/* /host/toolcache/*
          df -h /
      # The image's preinstalled runtime can't be updated in place
      # ("Invalid cross-device link" across the container's layers), so
      # install the current one fresh.
      - name: Reinstall the GNOME 51 runtime
        run: |
          flatpak uninstall -y --noninteractive org.gnome.Sdk//51 org.gnome.Platform//51 || true
          flatpak install -y --noninteractive flathub org.gnome.Sdk//51 org.gnome.Platform//51
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: piopio.flatpak
          manifest-path: build-aux/net.dunevent.Piopio.Devel.yml
          cache-key: flatpak-builder-${{ github.sha }}
      # Lints against GNOME 51's GTK and libadwaita, which the other jobs
      # can't: deprecations there only show up here.
      - name: Clippy against GNOME 51
        run: |
          flatpak run --share=network --filesystem="$PWD" \
            --env=PATH=/usr/bin:/usr/lib/sdk/rust-stable/bin \
            --env=CARGO_TARGET_DIR=/tmp/target \
            --command=sh org.gnome.Sdk//51 -c \
            "cd '$PWD' && cargo clippy --locked -p piopio --all-targets -- -D warnings"
      # Which call elements the GNOME runtime has (information for now).
      - name: GStreamer WebRTC in the runtime
        continue-on-error: true
        run: |
          for e in webrtcbin nicesrc dtlssrtpenc srtpenc opusenc rtpopuspay vp8enc gtk4paintablesink; do
            flatpak run --command=gst-inspect-1.0 org.gnome.Platform//51 $e > /dev/null 2>&1 \
              && echo "$e: yes" || echo "$e: MISSING"
          done

  # build-aux/dev.sh, answering its prompts: this machine, a Flatpak file,
  # a debug build. Only on manual runs, since it compiles everything again.
  dev-sh:
    name: dev.sh (manual runs)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: >-
        --privileged
        -v /usr/local/lib/android:/host/android
        -v /usr/share/dotnet:/host/dotnet
        -v /opt/hostedtoolcache:/host/toolcache
    steps:
      - name: Free disk space
        run: rm -rf /host/android/* /host/dotnet/* /host/toolcache/*
      - uses: actions/checkout@v4
      - run: printf '1\n1\n2\n' | build-aux/dev.sh
      - run: ls -lh dist/

  # Logs in to the test account on a real server. Skipped until the repository
  # has the PIOPIO_TEST_JID and PIOPIO_TEST_PASSWORD Actions secrets.
  integration:
    name: Integration (test server)
    needs: daemon
    runs-on: ubuntu-latest
    env:
      PIOPIO_TEST_JID: ${{ secrets.PIOPIO_TEST_JID }}
      PIOPIO_TEST_PASSWORD: ${{ secrets.PIOPIO_TEST_PASSWORD }}
    steps:
      - name: Check for test account secrets
        id: secrets
        run: |
          if [ -n "$PIOPIO_TEST_JID" ] && [ -n "$PIOPIO_TEST_PASSWORD" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Integration tests skipped: PIOPIO_TEST_JID and PIOPIO_TEST_PASSWORD are not set."
          fi
      - if: steps.secrets.outputs.present == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.secrets.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.secrets.outputs.present == 'true'
        # GStreamer headers: the daemon's tests build piopio-call.
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus libgstreamer1.0-dev \
            libgstreamer-plugins-bad1.0-dev libgstreamer-plugins-base1.0-dev
      - if: steps.secrets.outputs.present == 'true'
        env:
          PIOPIO_LOG: info,piopio_daemon=debug
        run: cargo test --locked -p piopio-daemon --test server -- --ignored
