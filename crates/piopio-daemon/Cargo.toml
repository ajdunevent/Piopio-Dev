[package]
name = "piopio-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1.0.104"
futures-util = "0.3.34"
piopio-dbus = { version = "0.1.0", path = "../piopio-dbus" }
sasl = { version = "0.5.2", default-features = false }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "process", "time"] }
tokio-xmpp = { version = "6", default-features = false, features = ["starttls", "direct-tls", "ring", "rustls-native-certs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = { version = "5.13.2", default-features = false, features = ["tokio"] }
