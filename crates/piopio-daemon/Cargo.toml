[package]
name = "piopio-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
aes-gcm = "0.10"
anyhow = "1.0.104"
base64 = "0.22"
futures-util = "0.3.34"
getrandom = "0.3"
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
oo7 = { version = "0.7", default-features = false, features = ["tokio", "native_crypto"] }
piopio-dbus = { version = "0.1.0", path = "../piopio-dbus" }
piopio-omemo = { version = "0.1.0", path = "../piopio-omemo" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "stream"] }
rusqlite = { version = "0.43", features = ["bundled-sqlcipher"] }
rustix = { version = "1", features = ["fs"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sasl = { version = "0.5.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.10"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "process", "time"] }
tokio-xmpp = { version = "6", default-features = false, features = ["starttls", "direct-tls", "insecure-tcp", "ring", "rustls-native-certs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = { version = "5.13.2", default-features = false, features = ["tokio"] }

[dev-dependencies]
piopio-call = { path = "../piopio-call" }
tempfile = "3.27.0"
