[package]
name = "piopio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_4"] }
piopio-dbus = { version = "0.1.0", path = "../piopio-dbus" }

[features]
# Piopio targets the GNOME 51 runtime (GTK 4.24, libadwaita 1.10). Building
# without this feature needs only libadwaita 1.4 and GTK 4.12, for
# development on distributions that do not ship GNOME 51 yet.
default = ["gnome-51"]
gnome-51 = ["adw/v1_10", "adw/gtk_v4_24"]
