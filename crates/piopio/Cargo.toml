[package]
name = "piopio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5", "gtk_v4_10"] }
async-channel = "2.5.0"
futures-util = "0.3.34"
piopio-dbus = { version = "0.1.0", path = "../piopio-dbus" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync"] }
zbus = { version = "5.13.2", default-features = false, features = ["tokio"] }

[features]
# Piopio targets the GNOME 51 runtime (GTK 4.24, libadwaita 1.10). Building
# without this feature needs only libadwaita 1.5 and GTK 4.14, for
# development on distributions that do not ship GNOME 51 yet.
default = ["gnome-51"]
gnome-51 = ["adw/v1_10", "adw/gtk_v4_24"]
