[workspace]
resolver = "3"
members = ["crates/piopio", "crates/piopio-daemon", "crates/piopio-dbus"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/ajdunevent/Piopio-Dev"
authors = ["AJ Dunevent"]

[workspace.dependencies]
piopio-dbus = { path = "crates/piopio-dbus" }

[profile.release]
lto = "thin"
codegen-units = 1
